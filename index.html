<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sudoku</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
    <header class="app-header">
        <h1>Sudoku</h1>

        <div class="controls">
            <div class="segmented" role="group" aria-label="Board size">
                <button type="button" data-size="4" aria-pressed="false">4&times;4</button>
                <button type="button" data-size="6" aria-pressed="false">6&times;6</button>
                <button type="button" data-size="9" aria-pressed="false">9&times;9</button>
            </div>

            <label class="field" for="difficulty">
                Difficulty
                <select id="difficulty"></select>
            </label>

            <div class="actions">
                <button type="button" id="new" class="button button--primary">New puzzle</button>
                <button type="button" id="check" class="button">Check</button>
                <button type="button" id="solve" class="button">Solve</button>
                <button type="button" id="reset" class="button">Reset</button>
            </div>
        </div>
    </header>

    <main>
        <div id="board" class="board" aria-label="Sudoku board"></div>
        <p id="status" class="status" role="status"></p>
        <p class="hint">Type 1&ndash;9, move with the arrow keys.</p>
    </main>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
